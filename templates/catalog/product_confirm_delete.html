{% extends 'base.html' %}
{% block content %}
<h2>Подтвердите удаление</h2>
<p>Вы действительно хотите удалить "{{ object }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a href="{% url 'product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
